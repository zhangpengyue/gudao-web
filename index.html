<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1013" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="谷道" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<title>谷道 · 情绪与龙头</title>
<style>
  :root{
    --bg:#0e1013; --card:#171a20; --card2:#1d212a; --line:#272c36;
    --tx:#e8eaee; --mu:#8b93a1; --dim:#5d6472;
    --up:#e8433a; --dn:#12a150; --warn:#e0a13a; --info:#4b8fe0; --ok:#3fa9a0;
    --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  /* ---------- 顶部 ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(14,16,19,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-size:16px;font-weight:600;letter-spacing:.5px}
  .brand span{font-size:11px;font-weight:400;color:var(--dim);margin-left:6px;letter-spacing:0}
  .hd-sub{font-size:11px;color:var(--mu);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{
    font:inherit;color:var(--tx);background:var(--card2);
    border:1px solid var(--line);border-radius:8px;padding:6px 12px;
    cursor:pointer;transition:.15s;
  }
  button:active{transform:scale(.97);opacity:.85}
  button:disabled{opacity:.45}
  button.primary{background:#24405f;border-color:#2c4a6e;color:#cfe2ff}
  /* ---------- 通用 ---------- */
  main{padding:12px 0 8px}
  .view[hidden]{display:none}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;margin:0 12px 10px;
  }
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-t{font-size:13px;color:var(--mu)}
  .muted{color:var(--mu)}
  .dim{color:var(--dim)}
  .sm{font-size:12px}
  .xs{font-size:11px}
  .up{color:var(--up)} .dn{color:var(--dn)}
  .row{display:flex;align-items:center;gap:8px}
  .sp{justify-content:space-between}
  .tag{
    display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;
    border:1px solid var(--line);color:var(--mu);line-height:1.7;
  }
  .tag.up{color:var(--up);border-color:rgba(232,67,58,.35);background:rgba(232,67,58,.1)}
  .tag.dn{color:var(--dn);border-color:rgba(18,161,80,.35);background:rgba(18,161,80,.1)}
  .tag.warn{color:var(--warn);border-color:rgba(224,161,58,.35);background:rgba(224,161,58,.1)}
  .tag.info{color:var(--info);border-color:rgba(75,143,224,.35);background:rgba(75,143,224,.1)}
  .tag.ok{color:var(--ok);border-color:rgba(63,169,160,.35);background:rgba(63,169,160,.1)}
  .split{height:1px;background:var(--line);margin:10px -14px}
  .empty{padding:26px 0;text-align:center;color:var(--dim);font-size:12px}
  /* ---------- 大结论卡 ---------- */
  .hero{padding:16px 14px}
  .hero-stage{font-size:26px;font-weight:600;letter-spacing:2px;line-height:1.2}
  .hero-sub{font-size:12px;color:var(--mu);margin-top:6px}
  .hero-advice{font-size:13px;margin-top:10px;color:#c9cdd4}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{background:var(--card2);border-radius:9px;padding:9px 10px}
  .kpi-v{font-size:18px;font-weight:600;line-height:1.25}
  .kpi-k{font-size:11px;color:var(--dim);margin-top:2px}
  /* ---------- 仓位条 ---------- */
  .bar{position:relative;height:26px;background:var(--card2);border-radius:7px;margin:12px 0 6px;overflow:hidden}
  .bar .rg{position:absolute;top:0;bottom:0;background:rgba(75,143,224,.22);border-left:1px solid rgba(75,143,224,.5);border-right:1px solid rgba(75,143,224,.5)}
  .bar .cur{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);box-shadow:0 0 0 2px rgba(14,16,19,.9)}
  .bar-lb{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  /* ---------- 列表行 ---------- */
  .list{margin:0 -14px}
  .li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
  .li:first-child{border-top:none}
  .li-n{flex:1;min-width:0}
  .li-n b{font-weight:500;font-size:13px}
  .li-n i{font-style:normal;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .li-v{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
  .idx{width:42px;text-align:center;font-size:11px;color:var(--dim)}
  /* ---------- 基金估算明细 ---------- */
  .li.tappable{cursor:pointer}
  .li.tappable:active{background:var(--card2)}
  .est{display:none;padding:2px 14px 12px;background:var(--card2);border-top:1px solid var(--line)}
  .est.on{display:block}
  .est-h{font-size:11px;color:var(--dim);padding:8px 0 7px;line-height:1.5}
  .er{display:grid;grid-template-columns:1fr 46px 54px 46px;gap:6px;align-items:baseline;
    font-size:11px;font-variant-numeric:tabular-nums;padding:3px 0}
  .er.erk{color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:2px}
  .ern{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ern i{font-style:normal;color:var(--dim);margin-left:4px;font-size:10px}
  .erw{text-align:right;color:var(--dim)}
  .erp,.erc{text-align:right}
  .est-f{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
  /* ---------- 底部导航 ---------- */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;background:rgba(14,16,19,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;background:none;border:none;border-radius:0;padding:9px 0 10px;
    color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav button.on{color:var(--tx)}
  nav .dot{width:16px;height:16px;border-radius:5px;border:1.5px solid currentColor;opacity:.7}
  nav button.on .dot{background:currentColor;opacity:1}
  /* ---------- 提醒 ---------- */
  .risk{border-left:2px solid var(--warn);padding:8px 10px;background:var(--card2);border-radius:0 8px 8px 0;margin-bottom:8px}
  .risk.hi{border-left-color:var(--up)}
  .risk.ok{border-left-color:var(--ok)}
  .risk b{font-size:13px;font-weight:500}
  .risk p{margin:3px 0 0;font-size:12px;color:var(--mu)}
  .banner{background:rgba(224,161,58,.1);border:1px solid rgba(224,161,58,.3);color:var(--warn);
    border-radius:9px;padding:9px 12px;margin:0 12px 10px;font-size:12px}
  .toast{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);
    background:#232830;border:1px solid var(--line);color:var(--tx);
    padding:9px 16px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;
    transition:.25s;z-index:50;max-width:80vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .mini{font:inherit;background:none;border:none;color:var(--info);padding:6px 9px;font-size:12px;
    min-width:32px;min-height:28px}
  /* ---------- 添加到主屏幕提示 ---------- */
  .install{
    position:fixed;left:12px;right:12px;z-index:40;display:none;align-items:center;gap:10px;
    bottom:calc(64px + env(safe-area-inset-bottom) + 8px);
    background:#232830;border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:12px;color:var(--mu);box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .install.on{display:flex}
  .install span{flex:1;line-height:1.4}
  .install b{color:var(--tx);font-weight:500}
  /* ---------- 添加表单弹层 ---------- */
  .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(101%);transition:transform .24s cubic-bezier(.2,.7,.3,1);
    max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .sheet.on{transform:translateY(0)}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sheet-h b{font-size:15px}
  .sheet-h .x{background:none;border:none;color:var(--dim);font-size:17px;padding:2px 6px;line-height:1}
  .fld{margin-bottom:11px}
  .fld > label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px}
  .fld input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;
    color:var(--tx);font:inherit;font-size:15px;padding:10px 12px;outline:none;
    font-variant-numeric:tabular-nums;transition:border-color .15s}
  .fld input:focus{border-color:#3b5a7d}
  .fld input::placeholder{color:var(--dim)}
  .fld .hit{font-size:12px;margin-top:6px;min-height:17px;color:var(--ok);line-height:1.35}
  .fld .hit.bad{color:var(--warn)}
  .fld .hit b{font-size:14px;font-weight:600;color:var(--tx)}
  .sheet-ok{width:100%;padding:12px;border-radius:10px;font-size:15px;margin-top:6px}
  .sheet-ok:disabled{opacity:.4}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div class="brand">谷道<span>情绪与龙头</span></div>
    <button id="btnRefresh">刷新</button>
  </div>
  <div class="hd-sub" id="hdSub"><span>正在加载…</span></div>
</header>

<main id="main">
  <section class="view" data-view="advice">
    <div id="banner"></div>
    <div class="card hero" id="hero"></div>
    <div class="card" id="posCard"></div>
    <div class="card" id="idxCard"></div>
    <div class="card" id="riskCard"></div>
  </section>

  <section class="view" data-view="market" hidden>
    <div class="card" id="poolCard"></div>
    <div class="card" id="leaderCard"></div>
    <div class="card" id="themeCard"></div>
    <div class="card" id="firstCard"></div>
  </section>

  <section class="view" data-view="etf" hidden>
    <div class="card" id="etfCard"></div>
    <div class="card" id="etfAddCard"></div>
  </section>

  <section class="view" data-view="pos" hidden>
    <div class="card" id="pfCard"></div>
    <div class="card" id="pfAddCard"></div>
  </section>

  <section class="view" data-view="watch" hidden>
    <div class="card" id="watchCard"></div>
    <div class="card" id="watchAddCard"></div>
  </section>
</main>

<nav id="nav">
  <button data-go="advice" class="on"><span class="dot"></span>建议</button>
  <button data-go="market"><span class="dot"></span>看盘</button>
  <button data-go="etf"><span class="dot"></span>ETF</button>
  <button data-go="pos"><span class="dot"></span>持仓</button>
  <button data-go="watch"><span class="dot"></span>盯盘</button>
</nav>

<div class="toast" id="toast"></div>

<div class="install" id="installTip">
  <span>加到主屏幕，下次<b>像 App 一样</b>全屏打开</span>
  <button class="mini" id="installGo">怎么做</button>
  <button class="mini" id="installNo" style="color:var(--dim)">关闭</button>
</div>

<script>
"use strict";

/* ============================================================
   0. 配置：将来加代理 / 换自建服务，只改 PROXY 一行
   ============================================================ */
const PROXY = "";   // 例：'https://xxx.workers.dev/?u='  留空则浏览器直连数据源
const VER = "v2026.11.05-1155";   // 页面版本，显示在添加卡片底部，方便确认拿到的是新版
function via(url){ return PROXY ? PROXY + encodeURIComponent(url) : url; }

const UT = "7eea3edcaed734bea9cbfc24409ed989";
const EP = {
  pool : k => "https://push2ex.eastmoney.com/getTopic" + k + "Pool"
             + "?ut=" + UT + "&dpt=wz.ztzt&Pageindex=0&pagesize=500&sort=fbt%3Aasc"
             + "&date=" + dateStr() + "&_=" + Date.now(),
  quote: syms => "https://qt.gtimg.cn/q=" + syms,
  kline: (sym, n) => "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param="
             + sym + ",day,,," + n + ",qfq",
  /* 场外基金：天天基金 App 接口（返回带 Access-Control-Allow-Origin:*，可批量） */
  fund : codes => "https://fundmobapi.eastmoney.com/FundMNewApi/FundMNFInfo?Fcodes="
             + codes.join(",") + "&pageIndex=1&pageSize=50&plat=Android&appType=ttjj"
             + "&product=EFund&Version=1&deviceid=1&_=" + Date.now(),
  /* 场外基金历史净值（同样支持跨域），用于算均线趋势 */
  fundNav: (code, n) => "https://fundmobapi.eastmoney.com/FundMNewApi/FundMNHisNetList?FCODE="
             + code + "&pageIndex=1&pageSize=" + n + "&plat=Android&appType=ttjj"
             + "&product=EFund&Version=1&deviceid=1&_=" + Date.now(),
  /* 场外基金季报持仓：前十大重仓股 + 各自占净值比，用于盘中估值 */
  fundHold: code => "https://fundmobapi.eastmoney.com/FundMNewApi/FundMNInverstPosition?FCODE="
             + code + "&deviceid=1&plat=Android&product=EFund&version=1&appType=ttjj"
             + "&_=" + Date.now(),
  /* 场外基金资产配置：股票/债券/现金各占多少，用于把重仓股涨幅放大到整只基金 */
  fundAlloc: code => "https://fundmobapi.eastmoney.com/FundMNewApi/FundMNAssetAllocationNew?FCODE="
             + code + "&deviceid=1&plat=Android&product=EFund&version=1&appType=ttjj"
             + "&_=" + Date.now(),
};

const INDICES = [
  ["上证指数", "sh000001"],
  ["深证成指", "sz399001"],
  ["创业板指", "sz399006"],
  ["沪深300",  "sh000300"],
  ["科创50",   "sh000688"],
];

/* ============================================================
   1. 工具
   ============================================================ */
function dateStr(d){
  d = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}
function dayKey(){ return dateStr(); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function num(v){ return (v == null || v === "" || isNaN(v)) ? null : Number(v); }
function fixed(v, n){ return v == null ? "-" : Number(v).toFixed(n); }
function signed(v, n){
  if (v == null) return "-";
  const s = Number(v).toFixed(n);
  return (Number(v) > 0 ? "+" : "") + s;
}
function clsOf(v){ return v == null ? "" : (v > 0 ? "up" : v < 0 ? "dn" : ""); }
function yi(v){ return v == null ? "-" : (v / 1e8).toFixed(1) + "亿"; }
function hm(v){
  if (v == null) return "-";
  const s = String(v).padStart(6, "0");
  return s.slice(0, 2) + ":" + s.slice(2, 4);
}
/* 封板时间排序键：补零到 6 位，和桌面版 zfill(6) 同一个修法 */
function timeKey(v){
  if (v == null) return "999999";
  return String(v).replace(/\.0$/, "").padStart(6, "0");
}
function symOf(code){
  code = String(code || "").trim();
  if (/^(92|8|4)/.test(code)) return "bj" + code;   // 北交所（920 新代码段也在内）
  if (/^[569]/.test(code)) return "sh" + code;
  if (/^[013]/.test(code)) return "sz" + code;
  return code;
}

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};

let toastTimer = null;
function toast(msg, ms){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), ms || 2200);
}

/* ============================================================
   底部表单弹层：输入 6 位代码自动识别名称
   openSheet({ title, okText, fields:[{key,label,ph,value,num,maxlength,lookup}],
               onSubmit(values, found) })
   ============================================================ */
let sheetCur = null;

function closeSheet(){
  if (!sheetCur) return;
  const cur = sheetCur;
  sheetCur = null;
  document.body.style.overflow = "";
  cur.mask.classList.remove("on");
  cur.box.classList.remove("on");
  setTimeout(() => { cur.mask.remove(); cur.box.remove(); }, 260);
}

function openSheet(opt){
  closeSheet();
  document.body.style.overflow = "hidden";   // 弹层打开时锁住背景滚动
  const mask = document.createElement("div");
  mask.className = "sheet-mask";
  const box = document.createElement("div");
  box.className = "sheet";

  box.innerHTML =
    '<div class="sheet-h"><b>' + esc(opt.title) + '</b><button class="x" type="button">✕</button></div>' +
    (opt.fields || []).map(function (f) {
      return '<div class="fld" data-k="' + esc(f.key) + '">' +
        "<label>" + esc(f.label) + "</label>" +
        '<input type="' + (f.type || "text") + '"' +
          ' inputmode="' + (f.num ? "decimal" : "text") + '"' +
          ' autocomplete="off" autocorrect="off" spellcheck="false"' +
          (f.maxlength ? ' maxlength="' + f.maxlength + '"' : "") +
          ' placeholder="' + esc(f.ph || "") + '"' +
          ' value="' + esc(f.value == null ? "" : String(f.value)) + '" />' +
        '<div class="hit"></div></div>';
    }).join("") +
    '<button class="primary sheet-ok" type="button">' + esc(opt.okText || "确定") + "</button>";

  document.body.appendChild(mask);
  document.body.appendChild(box);
  sheetCur = { mask: mask, box: box };
  requestAnimationFrame(function () { mask.classList.add("on"); box.classList.add("on"); });

  function q(k){ return box.querySelector('.fld[data-k="' + k + '"] input'); }
  function hitOf(k){ return box.querySelector('.fld[data-k="' + k + '"] .hit'); }
  const okBtn = box.querySelector(".sheet-ok");

  let found = null;
  const lookupField = (opt.fields || []).filter(function (f) { return f.lookup; })[0];

  if (lookupField){
    const input = q(lookupField.key);
    const hit = hitOf(lookupField.key);
    okBtn.disabled = true;

    let timer = null, seq = 0;
    async function run(){
      const code = input.value.replace(/\D/g, "").slice(0, 6);
      if (input.value !== code) input.value = code;
      const my = ++seq;
      found = null;
      okBtn.disabled = true;
      if (code.length !== 6){ hit.className = "hit"; hit.textContent = ""; return; }

      hit.className = "hit";
      hit.textContent = "识别中…";
      try{
        const r = await lookupName(code);
        if (my !== seq) return;                       // 期间又改了输入，丢弃旧结果
        if (!r){
          hit.className = "hit bad";
          hit.textContent = "没查到 " + code + "，确认代码是否正确";
          return;
        }
        found = r;
        const isFund = r.kind === "fund";
        hit.className = "hit";
        hit.innerHTML = "<b>" + esc(r.name) + "</b> · " + esc(code) +
          (isFund ? '　<span class="tag info">场外基金</span>' : "") +
          (r.price != null
            ? '　<span class="dim">' + (isFund ? "净值 " : "现价 ") +
              fixed(r.price, isFund ? 4 : (r.price < 10 ? 3 : 2)) + "</span>"
            : "");
        okBtn.disabled = false;
      }catch(e){
        if (my !== seq) return;
        hit.className = "hit bad";
        hit.textContent = "名称查询失败：" + (e.message || "网络异常");
      }
    }

    input.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(run, 280);
    });
    input.addEventListener("change", run);
    if (input.value) run();
  } else {
    okBtn.disabled = false;
  }

  okBtn.addEventListener("click", function () {

    (opt.fields || []).forEach(function (f) { values[f.key] = (q(f.key).value || "").trim(); });
    if (lookupField && !found) return toast("请先输入能识别的 6 位代码");

}

/* ============================================================
   2. 网络层：超时 + 重试 + GBK 解码 + 缓存
   ============================================================ */
const memCache = new Map();

async function req(url, opt){
  opt = opt || {};
  const tries = opt.tries == null ? 2 : opt.tries;
  const timeout = opt.timeout || 12000;
  let last;
  for (let i = 0; i < tries; i++){
    const ctl = new AbortController();
    const tid = setTimeout(() => ctl.abort(), timeout);
    try{
      const r = await fetch(via(url), { signal: ctl.signal, cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (opt.as === "text"){
        const buf = await r.arrayBuffer();
        return decodeText(buf);
      }
      return await r.json();
    }catch(e){
      last = e;
      if (i < tries - 1) await sleep(350 * (i + 1));
    }finally{
      clearTimeout(tid);
    }
  }
  throw last || new Error("请求失败");
}

function decodeText(buf){
  try{ return new TextDecoder("gbk").decode(buf); }
  catch(e){ return new TextDecoder("utf-8").decode(buf); }
}

/* 内存缓存 + localStorage 兜底
   staleOk=true 时：跨天也认旧缓存，且请求失败时退回过期数据。
   季报持仓一个季度才变一次，为了它每天重下一次、下不到就空着，没有意义。 */
async function memo(key, ttlMs, producer, persist, staleOk){
  const now = Date.now();
  const m = memCache.get(key);
  if (m && now - m.at < ttlMs) return m.v;

  if (persist){
    const ls = LS.get("gdc_" + key, null);
    if (ls && (staleOk || ls.d === dayKey()) && now - ls.at < ttlMs){
      memCache.set(key, { at: ls.at, v: ls.v });
      return ls.v;
    }
  }
  try{
    const v = await producer();
    memCache.set(key, { at: now, v });
    if (persist) LS.set("gdc_" + key, { d: dayKey(), at: now, v });
    return v;
  }catch(e){
    if (persist && staleOk){
      const ls = LS.get("gdc_" + key, null);
      if (ls && ls.v){ memCache.set(key, { at: ls.at, v: ls.v }); return ls.v; }
    }
    throw e;
  }
}

async function fetchQuotes(codes){
  const list = [...new Set(codes.filter(Boolean).map(symOf))];
  if (!list.length) return {};
  const txt = await req(EP.quote(list.join(",")), { as: "text", tries: 2, timeout: 10000 });
  const out = {};
  txt.split(";").forEach(line => {
    if (line.indexOf("=") < 0) return;
    const body = line.slice(line.indexOf("=") + 1).trim().replace(/^"|"$/g, "");
    const f = body.split("~");
    if (f.length < 33) return;
    const code = f[2];
    const price = Number(f[3]);
    if (!code || !isFinite(price) || price === 0) return;
    let pct = Number(f[32]);
    if (!isFinite(pct)) {
      const prev = Number(f[4]);
      pct = prev ? (price / prev - 1) * 100 : null;
    }
    out[code] = { price, pct, name: (f[1] || "").trim() || null,
                  ts: String(f[30] || "").slice(0, 8) };   // 行情日期，用于判断是不是当天的价
  });
  return out;
}

/* 场外基金（含货币基金）：一次可以传多个代码。

async function fetchFunds(codes){

                                                       .map(c => String(c).trim()))];
  if (!list.length) return {};
  const j = await req(EP.fund(list), { timeout: 10000 });
  const out = {};
  ((j && j.Datas) || []).forEach(it => {
    const code = String(it.FCODE || "").trim();
    if (!code) return;
    const nav = Number(it.NAV);
    const chg = Number(it.NAVCHGRT);
    out[code] = {
      price: isFinite(nav) && nav > 0 ? nav : null,

      name: it.SHORTNAME || null,

      kind: "fund",
    };
  });
  return out;
}

/* 场外基金历史净值：接口按时间倒序给，这里统一转成按日期升序的净值数组。
   净值一天才变一次，缓存 30 分钟足够。 */
async function fetchFundNav(code, n){
  return memo("fn_" + code + "_" + n, 30 * 60 * 1000, async () => {
    const j = await req(EP.fundNav(code, n), { tries: 2, timeout: 12000 });
    const arr = (j && j.Datas) || [];
    const rows = arr
      .map(it => ({ date: String(it.FSRQ || ""), nav: Number(it.DWJZ) }))
      .filter(x => x.date && isFinite(x.nav) && x.nav > 0)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  }, true, true);
}

/* 盘中估值。三步：
   ① Σ(权重×涨跌幅) ÷ Σ权重 → 重仓股的平均涨幅（这就是归一化，
      等于假设「季报没披露的那部分」走势和重仓股一致）
   ② × 股票仓位 → 放大到整只基金（债券、现金按 0 处理）
   ③ 昨日净值 ×(1+Y) → 估算净值
   返回 { y, norm, pos, cover, items, reportDate } */
function estimateFund(hold, alloc, px, today, navDay, loose){
  if (!hold || !hold.rows || !hold.rows.length) return null;
  let sumW = 0, sumWR = 0;
  const items = [];
  hold.rows.forEach(h => {
    const p = px ? px[h.code] : null;
    /* 判断标准是「报价比最新净值日更新」，而不是「报价日期 = 本机今天」。
       前者才代表净值还没兑现的那段涨跌；后者一遇到手机时区偏差、跨零点、
       或者净值日不是昨天（长假前后），就会把整只基金的成分股全判成无效，
       结果估值算不出来、界面只剩上一个净值日的涨跌幅。
       loose 是盘中兜底：严格判定全都落空时，只要报价日期就是今天（说明今天确实在交易），
       就照样按全量报价估，宁可粗一点，也不把整只基金空着。 */
    const fresh = p && p.pct != null && (
                  (navDay ? (!p.ts || p.ts > navDay) : (!today || !p.ts || p.ts === today)) ||
                  (loose && !!today && p.ts === today));
    const pct = fresh ? p.pct : null;
    if (pct != null){ sumW += h.w; sumWR += h.w * pct; }
    items.push({ code: h.code, name: h.name, w: h.w, pct,
                 contrib: pct == null ? null : h.w * pct / 100 });
  });
  if (sumW <= 0) return null;
  const norm = sumWR / sumW;
  const posKnown = !!(alloc && isFinite(alloc.stock) && alloc.stock > 0);
  const pos = posKnown ? Math.min(alloc.stock, 100) / 100 : 1;
  return {
    y: norm * pos, norm, pos, posKnown, cover: sumW, items,
    reportDate: hold.date || "", allocDate: alloc ? alloc.date : "",
  };
}

/* 6 位代码 → 名称。按规则定市场，取不到再试另外两个市场。
   返回 { code, sym, name, price } 或 null。 */
async function lookupName(code){
  code = String(code || "").trim();
  if (!/^\d{6}$/.test(code)) return null;
  const first = symOf(code);
  const order = [first];
  ["sh", "sz", "bj"].forEach(p => { const s = p + code; if (order.indexOf(s) < 0) order.push(s); });

  const txt = await req(EP.quote(order.join(",")), { as: "text", tries: 2, timeout: 9000 });
  const hits = {};
  txt.split(";").forEach(line => {
    if (line.indexOf("=") < 0) return;
    const sym = line.slice(0, line.indexOf("=")).trim().replace(/^v_/, "");
    const body = line.slice(line.indexOf("=") + 1).trim().replace(/^"|"$/g, "");
    const f = body.split("~");
    if (f.length < 4) return;
    const nm = (f[1] || "").trim();
    if (!nm || nm === "未知") return;
    if (f[2] !== code) return;                       // 返回的代码必须对得上
    /* 110022 这类 6 位码在沪市是可转债、在基金里是易方达消费，只按代码分辨不出来。
       转债不支持，直接跳过，让它落到后面的基金分支。 */
    if (/转债|债券|国债|企债|回购/.test(nm)) return;
    hits[sym] = { name: nm, price: Number(f[3]) || null };
  });
  for (let i = 0; i < order.length; i++){
    const h = hits[order[i]];
    if (h) return { code, sym: order[i], name: h.name, price: h.price, kind: "stock" };
  }

  /* 腾讯查不到 → 不是股票、也不在场内，按场外基金再查一次 */
  try{
    const fs = await fetchFunds([code]);
    const f = fs[code];
    if (f && f.name) return { code, sym: null, name: f.name, price: f.price, kind: "fund", date: f.date };
  }catch(e){ /* 基金接口失败就当查不到 */ }

  return null;
}

/* 指数行情单独取：必须按 sh000001 这种完整代码做键。
   注意 sh000001(上证指数) 与 sz000001(平安银行) 的 6 位代码相同，
   混在个股批量里会互相覆盖，所以指数单独一个请求、单独一套键。 */
async function fetchIndexQuotes(){
  const txt = await req(EP.quote(INDICES.map(x => x[1]).join(",")),
                        { as: "text", tries: 2, timeout: 10000 });
  const out = {};
  txt.split(";").forEach(line => {
    const eq = line.indexOf("=");
    if (eq < 0) return;
    const sym = line.split("=")[0].trim().replace(/^v_/, "").trim();
    const f = line.slice(eq + 1).trim().replace(/^"|"$/g, "").split("~");
    if (f.length < 33 || !f[3]) return;
    const price = Number(f[3]);
    if (!isFinite(price) || price === 0) return;
    let pct = Number(f[32]);
    if (!isFinite(pct)){
      const prev = Number(f[4]);
      pct = prev ? (price / prev - 1) * 100 : null;
    }
    out[sym] = { price, pct };
  });
  return out;
}

async function fetchKline(sym, n){  return memo("k_" + sym + "_" + n, 3 * 3600 * 1000, async () => {
    const j = await req(EP.kline(sym, n), { tries: 2, timeout: 14000 });
    const node = j && j.data && j.data[sym];
    const arr = node && (node.qfqday || node.day);
    if (!Array.isArray(arr) || !arr.length) throw new Error("K线为空");
    return arr.map(x => Number(x[2])).filter(v => isFinite(v));
  }, true);
}

/* ============================================================
   4. 规则层：与 Python 版逐条对齐
   ============================================================ */
const EMO_ADVICE = {
  "冰点": "多看少动，空仓或极小仓试错；等待跌停减少、出现止跌信号",
  "启动": "轻仓试错首板/二板，关注新题材；错了次日就走",
  "发酵": "主攻阶段，锁定主线题材的龙头，仓位可加重",
  "高潮": "持股待涨但不追加，逐步兑现后排；高潮次日不接力",
  "退潮": "坚决空仓或清仓，不抄跌停、不接飞刀；等新周期",
};
const EMO_ADJUST = {
  "冰点": [ 5, "冰点临近转折，可小仓试探，但总仓不宜激进"],
  "启动": [10, "启动期确定性上升，目标仓位上调"],
  "发酵": [15, "发酵期主攻，目标仓位上调"],
  "高潮": [-20, "高潮不追加、逐步兑现，目标仓位下调"],
  "退潮": [-40, "退潮期坚决收缩，目标仓位大幅下调"],
  "未判断": [0, "未判断情绪阶段，仅按大盘趋势给建议"],
};
const STOP_LOSS = -7.0;

function judgeEmotion(zt, dt, zb, maxLb){
  const totalOpen = zt + zb;
  const zbRate = totalOpen ? zb / totalOpen : 0;
  const reasons = [];

  if (zt >= 80) reasons.push("涨停" + zt + "家，赚钱效应强");
  else if (zt >= 50) reasons.push("涨停" + zt + "家，赚钱效应较好");
  else if (zt >= 26) reasons.push("涨停" + zt + "家，赚钱效应一般");
  else reasons.push("涨停仅" + zt + "家，赚钱效应低迷");

  if (dt >= 30) reasons.push("跌停" + dt + "家，亏钱效应显著");
  else if (dt >= 15) reasons.push("跌停" + dt + "家，亏钱效应明显");
  else if (dt >= 10) reasons.push("跌停" + dt + "家，存在亏钱效应");
  else reasons.push("跌停仅" + dt + "家，亏钱效应弱");

  const rate = Math.round(zbRate * 100) + "%";
  if (zbRate >= 0.5) reasons.push("炸板率" + rate + "，封板质量差");
  else if (zbRate >= 0.35) reasons.push("炸板率" + rate + "，炸板偏多");
  else if (zbRate >= 0.2) reasons.push("炸板率" + rate + "，处于正常水平");
  else reasons.push("炸板率" + rate + "，封板质量好");

  if (maxLb >= 5) reasons.push("最高" + maxLb + "板，连板空间完全打开");
  else if (maxLb === 4) reasons.push("最高" + maxLb + "板，有明确空间高度");
  else if (maxLb === 3) reasons.push("最高" + maxLb + "板，出现连板高度");
  else if (maxLb === 2) reasons.push("最高仅" + maxLb + "板，高度不足");
  else reasons.push("无连板高度，市场无赚钱示范");

  let stage;
  if (dt >= 30 || (dt >= 15 && zbRate >= 0.4)){
    stage = "退潮";
    reasons.push("跌停" + dt + "家+炸板率" + rate + "，亏钱效应显著 → 判定【退潮】");
  } else if (zt <= 25 || (maxLb <= 2 && dt >= 10)){
    stage = "冰点";
    reasons.push("涨停仅" + zt + "家且无高度，赚钱效应低迷 → 判定【冰点】");
  } else if (zt >= 80 && maxLb >= 5 && zbRate >= 0.35){
    stage = "高潮";
    reasons.push("涨停" + zt + "家+最高" + maxLb + "板但炸板率" + rate + "，过热 → 判定【高潮】");
  } else if (maxLb >= 4 && zt >= 50 && zbRate < 0.35){
    stage = "发酵";
    reasons.push("最高" + maxLb + "板打开空间+涨停" + zt + "家+炸板率" + rate + "低 → 判定【发酵】");
  } else if (maxLb >= 3 && dt < 10){
    stage = "启动";
    reasons.push("出现" + maxLb + "板高度+跌停仅" + dt + "家，情绪转暖 → 判定【启动】");
  } else {
    stage = "启动";
    reasons.push("指标介于冰点与发酵之间 → 按【启动】期轻仓应对");
  }
  return { stage, zbRate, reasons, zt, dt, zb, maxLb, advice: EMO_ADVICE[stage] };
}

function targetRange(market, stage){
  const bull = market["多头"] || 0;
  const bear = market["空头"] || 0;
  const total = bull + bear + (market["震荡"] || 0);
  let lo, hi, reason;
  if (total === 0){ lo = 0; hi = 30; reason = "无大盘数据，保守起见不超过3成"; }
  else if (bull / total >= 0.6){ lo = 60; hi = 90; reason = bull + "/" + total + "指数多头共振，确定性高"; }
  else if (bear / total >= 0.6){ lo = 0; hi = 20; reason = bear + "/" + total + "指数空头共振，以守为主"; }
  else { lo = 0; hi = 30; reason = "多空分化（多" + bull + "/空" + bear + "），方向不明"; }

  const adj = EMO_ADJUST[stage] || EMO_ADJUST["未判断"];
  let low = Math.max(0, Math.min(100, lo + adj[0]));
  let high = Math.max(0, Math.min(100, hi + adj[0]));
  if (low > high) low = high;
  return { low, high, reasons: adj[1] ? [reason, adj[1]] : [reason] };
}

function positionLevel(pct){
  if (pct <= 0) return "空仓";
  if (pct <= 20) return "轻仓";
  if (pct <= 50) return "半仓";
  if (pct <= 80) return "重仓";
  return "满仓";
}

function advise(curPct, market, stage, holdings, total){
  const tr = targetRange(market, stage);
  const low = tr.low, high = tr.high;
  const level = positionLevel(curPct);
  const unknown = total != null && total <= 0;
  let action, amount, reason;

  if (unknown){
    action = "待录入"; amount = 0;
    reason = "未填写总资金，无法计算真实仓位占比，暂不给加减仓结论";
  } else if (curPct > high){
    action = "减仓"; amount = Math.round((curPct - high) * 10) / 10;
    reason = "当前" + curPct + "%高于目标上限" + high + "%";
  } else if (curPct < low){
    action = "加仓"; amount = Math.round((low - curPct) * 10) / 10;
    reason = "当前" + curPct + "%低于目标下限" + low + "%";
  } else {
    action = "持有"; amount = 0;
    reason = "当前" + curPct + "%在目标区间[" + low + "%, " + high + "%]内";
  }

  const extra = [];
  if (stage === "退潮") extra.push("退潮期：反弹即减仓机会，不要把减仓拖成套牢");
  else if (stage === "高潮") extra.push("高潮期：高潮次日不接力，新资金暂停进场");
  if (unknown) extra.push("请到「持仓」页填写总资金，才能算仓位占比与调整幅度");

  return { curPct, level, low, high, action, amount, reason, extra, rangeTxt: (low === 0 && high === 0) ? "0%（空仓）" : low + "% ~ " + high + "%" };
}

/* 龙头筛选 */
function marketLeaders(rows, top){
  return rows.slice().sort((a, b) =>
    (b.lb - a.lb) || timeKey(a.fbt).localeCompare(timeKey(b.fbt)) || (a.zbc - b.zbc)
  ).slice(0, top || 15);
}
function themeLeaders(rows, minLb){
  minLb = minLb == null ? 2 : minLb;
  const map = new Map();
  rows.filter(r => r.lb >= minLb).forEach(r => {
    const old = map.get(r.ind);
    if (!old || r.lb > old.lb) map.set(r.ind, r);
  });
  return [...map.values()].sort((a, b) => b.lb - a.lb || timeKey(a.fbt).localeCompare(timeKey(b.fbt)));
}
function strongFirstBoard(rows){
  return rows.filter(r => r.lb === 1 && r.zbc === 0)
    .sort((a, b) => timeKey(a.fbt).localeCompare(timeKey(b.fbt)));
}
function heightStats(rows){
  const tiers = {};
  let max = 0;
  rows.forEach(r => { tiers[r.lb] = (tiers[r.lb] || 0) + 1; if (r.lb > max) max = r.lb; });
  return { max, tiers };
}
function ladderHealth(st){
  const tiers = st.tiers, top = st.max;
  if (top < 2) return "无梯队（市场无连板高度，情绪偏弱）";
  const missing = [];
  for (let n = 2; n < top; n++) if (!tiers[n]) missing.push(n + "板");
  if (!missing.length) return "梯队完整（首板→" + top + "板层层递进）";
  return "梯队断层：缺 " + missing.join("、") + "，高位股独木难支，注意风险";
}

/* 均线趋势 */
function ma(arr, n, off){
  off = off || 0;
  const end = arr.length - off, start = end - n;
  if (start < 0) return null;
  let s = 0;
  for (let i = start; i < end; i++) s += arr[i];
  return s / n;
}
function trendOf(closes){
  if (!closes || closes.length < 61) return null;
  const c = closes[closes.length - 1];
  const m20 = ma(closes, 20), m60 = ma(closes, 60), m60p = ma(closes, 60, 5);
  if (m20 == null || m60 == null || m60p == null) return null;
  const slope = m60 - m60p;
  let state = "震荡";
  if (c > m20 && m20 > m60 && slope > 0) state = "多头";
  else if (c < m20 && m20 < m60 && slope < 0) state = "空头";
  return { state, close: c, ma20: m20, ma60: m60, slope, dev: (c / m20 - 1) * 100 };
}
function etfSignal(state, dev){
  if (state === "多头"){
    if (dev != null && dev <= 3) return ["加仓", "多头趋势，现价贴近MA20（偏离" + signed(dev, 1) + "%），回踩到位可加仓"];
    return ["持有", dev != null ? "多头趋势但已偏离MA20 " + signed(dev, 1) + "%，不追高，持有等回踩" : "多头趋势，持有"];
  }
  if (state === "震荡"){
    if (dev != null && dev >= 5)
      return ["观望", "中期趋势未明朗，但短期已高于MA20 " + signed(dev, 1) + "%，涨幅偏大，别追，等回踩"];
    if (dev != null && dev <= -5)
      return ["观望", "中期趋势未明朗，短期低于MA20 " + fixed(-dev, 1) + "%，跌出空间，可小仓分批"];
    return ["观望", "趋势未确立（MA20/MA60未多头排列），方向不明，观望等确认"];
  }
  if (state === "空头") return ["减仓", "趋势向下" + (dev != null ? "（现价低于MA20 " + fixed(-dev, 1) + "%）" : "") + "，反弹减仓回避"];
  return ["—", "数据不足，无法判断"];
}

function loadEtfWatch(){

}
function saveEtfWatch(v){ LS.set("gd_etf", v); }
function loadWatch(){

}
function saveWatch(v){ LS.set("gd_watch", v); }

const ST = {
  loading: false,
  emo: null,
  pools: null,
  idx: [],
  market: {},
  live: null,
  etf: [],

};

/* ============================================================
   6. 一轮刷新
   ============================================================ */
/* 刷新失败不能把界面卡在「刷新中」：外面包一层，保证按钮复位、已有数据照旧渲染。
   以前中途一抛错，按钮永远是「刷新中」，页面就停在上一次的内容里，
   看起来就像「数据一直没更新」。 */
async function refreshAll(silent){
  if (ST.loading) return;
  ST.loading = true;
  const btn = document.getElementById("btnRefresh");
  if (btn){ btn.disabled = true; btn.textContent = "刷新中"; }
  try{
    await refreshAllInner(silent);
  }catch(e){
    console.warn("[refresh]", e);
    toast("刷新失败：" + ((e && e.message) || "网络异常"));
    try{ renderAll(); }catch(_){}
  }finally{
    ST.loading = false;
    if (btn){ btn.disabled = false; btn.textContent = "刷新"; }
  }
}

async function refreshAllInner(silent){
  const pf = loadPortfolio();
  const etfW = loadEtfWatch();
  const watchW = loadWatch();
  const warns = [];

  const allCodes = [
    ...pf.holdings.map(h => h.code),
    ...etfW.map(e => e.code),
    ...watchW.map(w => w.code),
  ].filter(Boolean);

  /* --- 三池 --- */
  let poolTask = (async () => {
    try{
      const zt = await fetchPool("ZT");
      const [dt, zb] = await Promise.allSettled([fetchPool("DT"), fetchPool("ZB")]);
      if (dt.status !== "fulfilled") warns.push("跌停池获取失败");
      if (zb.status !== "fulfilled") warns.push("炸板池获取失败");

      const rows = zt.rows.map(normZt);
      ST.pools = {
        zt: rows,
        ztCount: zt.count,
        dtCount: dt.status === "fulfilled" ? dt.value.count : null,
        zbCount: zb.status === "fulfilled" ? zb.value.count : null,
      };
      ST.dataDate = zt.date;
      if (dt.status === "fulfilled" || zb.status === "fulfilled"){
        const ok = dt.status === "fulfilled" ? dt.value : zb.value;
        if (ok.date) ST.dataDate = ok.date;
      }
      const maxLb = rows.reduce((m, r) => Math.max(m, r.lb), 0);
      if (ST.pools.dtCount != null && ST.pools.zbCount != null){
        ST.emo = judgeEmotion(zt.count, ST.pools.dtCount, ST.pools.zbCount, maxLb);
      } else {
        ST.emo = { stage: "未判断", reasons: ["部分数据源失败，本轮不判阶段"], advice: "数据源异常，先观望",
                   zt: zt.count, dt: null, zb: null, maxLb, zbRate: null };
      }
    }catch(e){
      warns.push("三池获取失败：" + e.message);
      ST.pools = null;
      ST.emo = { stage: "未判断", reasons: ["三池接口获取失败", e.message], advice: "数据源异常，先观望",
                 zt: null, dt: null, zb: null, maxLb: null, zbRate: null };
    }
  })();

  /* --- 指数趋势（5 个 K 线） + 指数当日涨跌幅 --- */
  let idxTask = (async () => {
    const qp = fetchIndexQuotes().catch(() => ({}));
    /* 并行拉，别一个接一个等——串行 5 个会把后面的基金请求推到十几秒后，弱网容易超时 */
    const out = await Promise.all(INDICES.map(async ([name, sym]) => {
      try{
        const closes = await fetchKline(sym, 80);
        const t = trendOf(closes);
        return { name, sym, ...(t || { state: "数据不足" }) };
      }catch(e){
        return { name, sym, state: "获取失败" };
      }
    }));
    const iq = await qp;
    out.forEach(o => {
      const q = iq[o.sym];
      if (q){ o.price = q.price; o.pct = q.pct; }
    });
    ST.idx = out;
    const mk = { "多头": 0, "震荡": 0, "空头": 0 };
    out.forEach(o => { if (mk[o.state] != null) mk[o.state]++; });
    ST.market = mk;
  })();

  /* --- 行情（持仓 + ETF + 盯盘，一次批量） --- */
  let quoteTask = (async () => {
    try{ return await fetchQuotes(allCodes); }
    catch(e){ warns.push("实时行情获取失败：" + e.message); return {}; }
  })();

  const [quotes] = await Promise.all([quoteTask, poolTask, idxTask]);

  /* --- 场外基金净值（腾讯行情不认识这类代码，单独取一次并并入 quotes） --- */
  {
    const cand = [];
    [...pf.holdings, ...etfW, ...watchW].forEach(x => {
      const c = String((x && x.code) || "").trim();
      if (!/^\d{6}$/.test(c)) return;
      if (x.kind === "fund") cand.push(c);        // 已标记为场外基金
      else if (!quotes[c]) cand.push(c);          // 行情里没有的，可能是老记录里的场外基金
    });
    if (cand.length){
      try{
        const fq = await fetchFunds(cand);
        Object.keys(fq).forEach(c => { if (!quotes[c]) quotes[c] = fq[c]; });   // 股票、场内优先，不覆盖
        let dirty = false;
        const mark = (arr, save) => {
          let hit = false;
          arr.forEach(x => {
            const c = String((x && x.code) || "").trim();
            if (quotes[c] && quotes[c].kind === "fund" && x.kind !== "fund"){ x.kind = "fund"; hit = true; }
          });
          if (hit){ dirty = true; save(arr); }
        };
        mark(pf.holdings, a => { pf.holdings = a; savePortfolio(pf); });
        mark(etfW, saveEtfWatch);
        mark(watchW, saveWatch);
      }catch(e){ warns.push("场外基金净值获取失败"); }
    }
  }

  /* 老记录里只存了代码的，用行情返回的名称补上，并写回本地（只补一次） */
  {
    let dirty = false;
    const fill = (arr, save) => {
      let hit = false;
      (arr || []).forEach(x => {
        const q = quotes[String(x.code || "").trim()];
        const nm = q && q.name;
        if (nm && (!x.name || x.name === x.code)) { x.name = nm; hit = true; }
      });
      if (hit) { dirty = true; save(arr); }
    };
    fill(pf.holdings, a => { pf.holdings = a; savePortfolio(pf); });
    fill(etfW, saveEtfWatch);
    fill(watchW, saveWatch);
    if (dirty) { /* 已写回，下次打开就是带名称的 */ }
  }

  /* --- 场外基金盘中估值 ---
     季报持仓 + 实时股价按权重加权，拟合当天的净值涨跌。
     只有「净值还没更新到当天」时才估，否则直接用官方净值。 */
  const EST = {};
  ST.estErr = {};
  ST.estDbg = {};
  try{
    const codes = [];
    [...pf.holdings, ...etfW, ...watchW].forEach(x => {
      const c = String((x && x.code) || "").trim();
      const q = quotes[c];
      if (q && q.kind === "fund" && codes.indexOf(c) < 0) codes.push(c);
    });
    if (codes.length){
      const metas = await Promise.all(codes.map(async c => {
        let hold = null, alloc = null, holdErr = "", allocErr = "";
        try{ hold = await fetchFundHold(c); }catch(e){ holdErr = (e && e.message) || "请求失败"; }
        try{ alloc = await fetchFundAlloc(c); }catch(e){ allocErr = (e && e.message) || "请求失败"; }
        return { c, hold, alloc, holdErr, allocErr };
      }));
      /* 所有成分股合并成一次行情请求，别一只基金发一次 */
      const all = [];
      metas.forEach(m => {
        if (!m.hold) return;
        m.hold.rows.forEach(r => { if (all.indexOf(r.code) < 0) all.push(r.code); });
      });
      let hq = {};
      if (all.length){ try{ hq = await fetchQuotes(all); }catch(e){} }
      const today = dateStr();
      metas.forEach(m => {
        const q = quotes[m.c];
        const navDay = q && q.date ? String(q.date).replace(/-/g, "") : "";
        const rows = (m.hold && m.hold.rows) || [];
        /* 诊断数据：估不出来的时候，让用户点开就能看到卡在哪一步 */
        ST.estDbg[m.c] = {
          navDay, nav: q ? q.price : null, pct: q ? q.pct : null,
          n: rows.length,
          got: rows.filter(r => hq[r.code]).length,
          freshN: rows.filter(r => { const p = hq[r.code]; return p && p.pct != null && p.ts === today; }).length,
          holdDate: (m.hold && m.hold.date) || "",
          holdErr: m.holdErr, allocErr: m.allocErr,
          pos: (m.alloc && isFinite(m.alloc.stock) && m.alloc.stock > 0) ? m.alloc.stock : null,
        };
        if (navDay === today){ ST.estErr[m.c] = "净值已更新"; return; }   // 净值已出，不用估
        let e = estimateFund(m.hold, m.alloc, hq, today, navDay);
        if (!e) e = estimateFund(m.hold, m.alloc, hq, today, navDay, true);   // 兜底：报价确实是今天的就照算
        if (e){ e.at = new Date().toTimeString().slice(0, 5); EST[m.c] = e; }
        else ST.estErr[m.c] = m.holdErr ? "持仓接口失败"
                            : (!rows.length ? "季报持仓为空"
                            : (!Object.keys(hq).length ? "成分股行情没取到"
                            : "成分股报价不是今天"));
      });
    }
  }catch(e){ console.warn("[est]", e); }

  /* --- 持仓 --- */
  {
    const total = pf.total;
    let invested = 0;
    const holdings = pf.holdings.map(h => {
      const code = String(h.code || "").trim();
      const q = quotes[code];
      const cost = Number(h.cost) || 0;
      const shares = Number(h.shares) || 0;
      const nav = q ? q.price : null;
      const est = EST[code];
      /* 场外基金盘中用估算净值算市值，这样「今日浮盈」才有意义 */
      const price = (est && nav != null) ? nav * (1 + est.y / 100) : nav;
      const mv = price != null && shares ? price * shares : (Number(h.mv) || 0);
      let pnl = null;
      if (price != null && cost) pnl = (price / cost - 1) * 100;
      invested += mv || 0;
      const isFund = h.kind === "fund" || (q && q.kind === "fund");
      return {
        code, name: h.name || h.code, cost, shares, isFund,
        price, nav, estY: est ? est.y : null, pct: q ? q.pct : null, mv,
        pnl: pnl == null ? null : Math.round(pnl * 100) / 100,
        weight: total > 0 && mv ? Math.round(mv / total * 1000) / 10 : null,
      };
    });
    ST.live = {
      total,
      holdings,
      pct: total > 0 ? Math.round(invested / total * 1000) / 10 : 0,
      invested,
    };
  }

  /* --- ETF --- */
  {
    /* 并行拉每只的 K 线 / 历史净值。原来是 for + await 串行，自选一多，
       最后那只的请求要排在十几秒之后，弱网下很容易超时拿不到数据 */
    const rows = await Promise.all(etfW.map(async w => {
      const code = String(w.code || "").trim();
      const q = quotes[code];

      /* 场外基金：用历史净值算均线，规则与 ETF 完全一致（数据只到 T-1 净值） */
      if (q && q.kind === "fund"){
        let navs = null;
        try{ navs = await fetchFundNav(code, 100); }catch(e){}
        const closes = navs ? navs.map(x => x.nav) : null;
        const nm = w.name || q.name || code;
        const dy = q.date || "—";
        const est = EST[code] || null;
        const base = { code, name: nm, price: q.price, pct: q.pct, isFund: true, est,
                       estErr: ST.estErr ? (ST.estErr[code] || null) : null,
                       estDbg: ST.estDbg ? (ST.estDbg[code] || null) : null };

        if (!closes || closes.length < 61){
          return { ...base, state: "场外", sig: "—",
                   why: "场外基金 · 净值日 " + dy + "（历史净值不足 60 个交易日，判断不了趋势）" };
        }
        if (closes.every(v => v === closes[0])){
          return { ...base, state: "场外", sig: "—",
                   why: "净值恒定（货币/短债类），不做趋势判断 · 净值日 " + dy };
        }
        const ftr = trendOf(closes);
        if (!ftr){
          return { ...base, state: "场外", sig: "—", why: "历史净值不足，无法判断趋势" };
        }
        const fs = etfSignal(ftr.state, ftr.dev);
        return { ...base, state: ftr.state, sig: fs[0], dev: ftr.dev,
                 why: fs[1].replace(/现价/g, "净值") + " · 净值日 " + dy };
      }

      let t = null;
      try{ t = trendOf(await fetchKline(symOf(code), 80)); }catch(e){}
      if (!q){
        return { code, name: w.name || code, price: null, pct: null, state: "获取失败", sig: "—",
                 isFund: w.kind === "fund",
                 why: w.kind === "fund" ? "基金净值获取失败，请检查代码" : "实时行情获取失败，请检查代码" };
      }
      const state = t ? t.state : "获取失败";
      const dev = t ? (q.price / t.ma20 - 1) * 100 : null;
      const s = etfSignal(state, dev);
      return { code, name: w.name || code, price: q.price, pct: q.pct, state, sig: s[0], why: s[1], dev };
    }));
    ST.etf = rows;
  }

  /* --- 盯盘 --- */
  {
    const rows = [];
    for (const w of watchW){
      const code = String(w.code || "").trim();
      const q = quotes[code];
      const e = EST[code];
      rows.push({
        code, name: w.name || code, isFund: w.kind === "fund" || (q && q.kind === "fund"),
        price: q ? q.price : null, pct: q ? q.pct : null, estY: e ? e.y : null,
        buy: Number(w.buy) || null, stop: Number(w.stop) || null,
        vsBuy: q && w.buy ? Math.round((q.price / w.buy - 1) * 1000) / 10 : null,
        vsStop: q && w.stop ? Math.round((q.price / w.stop - 1) * 1000) / 10 : null,
      });
    }
    ST.watch = rows;
  }

  ST.warn = warns;
  ST.updatedAt = new Date();
  renderAll();
  if (!silent && warns.length) toast(warns[0]);
}

   7. 渲染
   ============================================================ */
function renderAll(){
  renderHeader();
  renderAdvice();
  renderMarket();
  renderEtf();
  renderPos();
  renderWatch();
}

function renderHeader(){
  const parts = [];
  if (ST.updatedAt){
    const t = ST.updatedAt;
    parts.push("<span>" + String(t.getHours()).padStart(2, "0") + ":" +
               String(t.getMinutes()).padStart(2, "0") + ":" +
               String(t.getSeconds()).padStart(2, "0") + " 更新</span>");
  }
  if (ST.emo && ST.emo.stage && ST.emo.stage !== "未判断"){
    parts.push('<span class="tag info">' + ST.emo.stage + "</span>");
  }
  if (ST.warn.length) parts.push('<span class="tag warn">' + esc(ST.warn[0]) + "</span>");
  document.getElementById("hdSub").innerHTML = parts.join("") || "<span>正在加载…</span>";
}

function bannerHtml(){
  if (!ST.dataDate) return "";
  if (ST.dataDate === dateStr()) return "";
  const s = ST.dataDate;
  return '<div class="banner">今日休市或尚未开盘，展示的是 ' +
         s.slice(4, 6) + "-" + s.slice(6, 8) + " 的数据</div>";
}

function renderAdvice(){
  document.getElementById("banner").innerHTML = ST.warn.length
    ? '<div class="banner">' + ST.warn.map(esc).join("；") + "</div>" + bannerHtml()
    : bannerHtml();

  const emo = ST.emo;
  const pf = ST.live || { total: 0, holdings: [], pct: 0 };
  const adv = advise(pf.pct, ST.market, emo ? emo.stage : "未判断", pf.holdings, pf.total);

  /* 情绪大卡 */
  const stageColor = emo && emo.stage === "退潮" ? "dn"
    : emo && (emo.stage === "高潮" || emo.stage === "发酵") ? "up" : "";
  document.getElementById("hero").innerHTML =
    '<div class="row sp"><div>' +
      '<div class="hero-stage ' + stageColor + '">' + (emo ? emo.stage : "—") + "</div>" +
      '<div class="hero-sub">' + (emo && emo.zt != null
        ? "涨停 " + emo.zt + " · 跌停 " + (emo.dt == null ? "?" : emo.dt) +
          " · 炸板 " + (emo.zb == null ? "?" : emo.zb) +
          (emo.zbRate != null ? " · 炸板率 " + Math.round(emo.zbRate * 100) + "%" : "") +
          (emo.maxLb ? " · 最高 " + emo.maxLb + "板" : "")
        : "数据不足") + "</div>" +
    "</div>" +
    (emo && emo.maxLb
      ? '<div class="kpi" style="text-align:center;min-width:64px"><div class="kpi-v">' + emo.maxLb +
        '</div><div class="kpi-k">最高板</div></div>'
      : "") +
    "</div>" +
    '<div class="hero-advice">' + esc(emo ? emo.advice : "数据源异常，先观望") + "</div>";

  /* 仓位卡 */
  const low = adv.low, high = adv.high, cur = adv.curPct;
  const total = ST.live ? ST.live.total : 0;
  const actCls = adv.action === "减仓" ? "dn" : adv.action === "加仓" ? "up" : "";
  const pending = adv.action === "待录入";   // 没填总资金：不假装 0% 空仓
  document.getElementById("posCard").innerHTML =
    '<div class="card-h"><span class="card-t">仓位建议</span>' +
      '<span class="tag ' + (adv.action === "减仓" ? "dn" : adv.action === "加仓" ? "up" : "") + '">' +
      esc(adv.action) + (adv.amount ? " " + adv.amount + "%" : "") + "</span></div>" +
    '<div class="row sp" style="align-items:flex-end">' +
      (pending
        ? '<div><span style="font-size:24px;font-weight:600" class="dim">—</span>' +
          '<span class="sm muted"> 未填总资金</span></div>'

function buildRisks(){
  const out = [];
  const pf = ST.live;
  if (pf){
    pf.holdings.forEach(h => {
      if (h.pnl != null && h.pnl <= STOP_LOSS){
        out.push({ lv: "hi", t: "止损：" + h.name,
          m: "亏损 " + fixed(h.pnl, 1) + "%，已破 " + STOP_LOSS + "% 止损线，无条件止损" });
      }
      if (h.weight != null && h.weight >= 40){
        out.push({ lv: "", t: "超配：" + h.name,
          m: "占总资金 " + fixed(h.weight, 1) + "%，建议降到 30% 以内" });
      }
    });
  }
  ST.watch.forEach(w => {
    if (w.price == null) return;
    if (w.stop && w.price <= w.stop){
      out.push({ lv: "hi", t: "破计划止损：" + w.name,
        m: "现价 " + fixed(w.price, 2) + " ≤ 止损 " + w.stop + "，计划失效，离场" });
    } else if (w.buy && w.price <= w.buy){
      out.push({ lv: "ok", t: "到达买价：" + w.name,
        m: "现价 " + fixed(w.price, 2) + " ≤ 计划买价 " + w.buy + "，可按计划买入" });
    }
  });
  return out;
}

/* 点开看是哪几只重仓股在拉：权重、今日涨跌、对净值的贡献（百分点） */
/* 估值算不出来时的诊断面板：把每一步的结果摊开，方便定位是接口挂了还是数据没更新 */
function estDiag(r){
  const d = r.estDbg;
  if (!r.isFund || !r.estErr || r.estErr === "净值已更新") return "";
  const lines = [];
  if (d){
    lines.push("净值日 " + (d.navDay || "—") + " · 单位净值 " + fixed(d.nav, 4) +
               " · 上一日 " + signed(d.pct, 2) + "%");
    lines.push("季报持仓 " + (d.n || 0) + " 只" + (d.holdDate ? "（" + d.holdDate + "）" : "") +
               " · 拿到行情 " + (d.got || 0) + " 只 · 今日报价 " + (d.freshN || 0) + " 只" +
               (d.pos != null ? " · 股票仓位 " + fixed(d.pos, 2) + "%" : ""));
    if (d.holdErr) lines.push("持仓接口：" + d.holdErr);
    if (d.allocErr) lines.push("资产配置接口：" + d.allocErr);
  }
  /* 东财的季报持仓接口只对手机 UA 放行，电脑浏览器会被风控成「网络繁忙」 */
  if (!/Mobile|Android|iPhone|iPad|iPod|HarmonyOS|MicroMessenger/i.test(navigator.userAgent))
    lines.push("当前是电脑浏览器：这个接口只对手机 UA 放行，用手机打开就能算出来");
  const head = r.estErr === "季报持仓为空"
    ? "没有盘中估值：季报里没有股票持仓（债基/货基）"
    : "估值暂缺：" + r.estErr;
  return '<div class="est" id="est-' + esc(r.code) + '">' +
    '<div class="est-h">' + esc(head) + "</div>" +
    '<div class="est-f">' + (lines.length ? lines.map(esc).join("<br>") : "没有拿到诊断数据，下拉刷新一次试试") + "</div>" +
  "</div>";
}

function estPanel(r){
  const e = r.est;
  if (!e) return estDiag(r);
  const items = e.items.map(it =>
    '<div class="er">' +
      '<span class="ern">' + esc(it.name) + "<i>" + esc(it.code) + "</i></span>" +
      '<span class="erw">' + fixed(it.w, 1) + "%</span>" +
      '<span class="erp ' + clsOf(it.pct) + '">' + (it.pct == null ? "—" : signed(it.pct, 2) + "%") + "</span>" +
      '<span class="erc ' + clsOf(it.contrib) + '">' + (it.contrib == null ? "—" : signed(it.contrib, 2)) + "</span>" +
    "</div>").join("");
  return '<div class="est" id="est-' + esc(r.code) + '">' +
    '<div class="est-h">季报 ' + esc(e.reportDate || "—") + " · 前十大覆盖 " + fixed(e.cover, 1) +
      "% · " + (e.posKnown ? "股票仓位 " + fixed(e.pos * 100, 1) + "%" : "仓位未披露，按满仓计") +

}

}

function renderWatch(){
  const rows = ST.watch;
  document.getElementById("watchCard").innerHTML =
    '<div class="card-h"><span class="card-t">盯盘股</span><span class="xs dim">' + rows.length + " 只</span></div>" +
    (rows.length ? '<div class="list">' + rows.map(r => {
      let flag = "";
      if (r.price != null && r.stop && r.price <= r.stop) flag = '<span class="tag up">破止损</span>';
      else if (r.price != null && r.buy && r.price <= r.buy) flag = '<span class="tag ok">到买价</span>';
      return '<div class="li">' +
        '<div class="li-n"><b>' + esc(r.name) + "</b>" +
          '<span class="xs dim" style="margin-left:6px">' + esc(r.code) + "</span> " + flag +
          "<i>买 " + (r.buy || "-") + " · 损 " + (r.stop || "-") +
          (r.vsStop != null ? " · 距止损 " + signed(r.vsStop, 1) + "%" : "") + "</i></div>" +
        '<div class="li-v">' + fixed(r.price, r.isFund ? 4 : 2) +
          '<div class="xs ' + clsOf(r.estY != null ? r.estY : r.pct) + '">' +
            (r.estY != null ? "估 " : "") + signed(r.estY != null ? r.estY : r.pct, 2) + "%</div></div>" +
        '<button class="mini" data-del-watch="' + esc(r.code) + '">删</button>' +
      "</div>";
    }).join("") + "</div>" : '<div class="empty">还没有盯盘股</div>');

  document.getElementById("watchAddCard").innerHTML =
    '<div class="card-h"><span class="card-t">添加盯盘股</span></div>' +
    '<div class="xs dim">填了买价/止损价，页面会提示「到买价」「破止损」</div>' +
    '<div style="margin-top:10px"><button id="btnAddWatch" class="primary">+ 添加</button></div>';

  document.getElementById("btnAddWatch").onclick = () => {
    openSheet({
      title: "添加盯盘股",
      okText: "添加",
      fields: [
        { key: "code", label: "代码（6 位，自动识别，场外基金也行）", ph: "600000", num: true, maxlength: 6, lookup: true },
        { key: "buy", label: "计划买价（可留空）", ph: "跌到这个价提醒", num: true },
        { key: "stop", label: "止损价（可留空）", ph: "跌破这个价提醒", num: true },
      ],
      onSubmit: (v, found) => {
        const buy = Number(v.buy), stop = Number(v.stop);
        const list = loadWatch();
        if (list.some(x => String(x.code) === found.code)) return toast("已经在盯了");
        list.push({
          code: found.code, name: found.name,
          buy: isFinite(buy) && buy > 0 ? buy : null,
          stop: isFinite(stop) && stop > 0 ? stop : null,
        });
        saveWatch(list);
        closeSheet();
        toast("已添加 " + found.name);
        refreshAll(true);
      },
    });
  };
  document.querySelectorAll("[data-del-watch]").forEach(b => {
    b.onclick = () => {
      const code = b.getAttribute("data-del-watch");
      saveWatch(loadWatch().filter(x => x.code !== code));
      refreshAll(true);
    };
  });
}

/* ============================================================
   8. 交互
   ============================================================ */
document.querySelectorAll("#nav button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b === btn));
    const go = btn.getAttribute("data-go");
    document.querySelectorAll(".view").forEach(v => {
      v.hidden = v.getAttribute("data-view") !== go;
    });
    window.scrollTo({ top: 0 });
  };
});

document.getElementById("btnRefresh").onclick = () => refreshAll(false).catch(e => toast("刷新失败：" + e.message));

/* 页面可见时每分钟自动刷新一次 */
setInterval(() => {
  if (document.visibilityState === "visible" && !ST.loading) refreshAll(true).catch(() => {});
}, 60000);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !ST.loading){
    const age = ST.updatedAt ? Date.now() - ST.updatedAt.getTime() : 1e9;
    if (age > 60000) refreshAll(true).catch(() => {});
  }
});

refreshAll(true).catch(e => {
  document.getElementById("hdSub").innerHTML = '<span class="tag warn">加载失败：' + esc(e.message) + "</span>";
});

/* ============================================================
   添加到主屏幕：仅在移动端、且尚未处于独立窗口时提示一次
   ============================================================ */
(function () {
  const tip = document.getElementById("installTip");
  if (!tip) return;
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
                     || window.navigator.standalone === true;
  const isMobile = /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(navigator.userAgent);
  let off = false;
  try { off = localStorage.getItem("gudao_install_tip") === "off"; } catch (_) {}
  if (standalone || !isMobile || off) return;

  const dismiss = () => {
    tip.classList.remove("on");
    clearTimeout(autoTimer);
    try { localStorage.setItem("gudao_install_tip", "off"); } catch (_) {}
  };
  // 只打扰一次：15 秒后自己收起来
  const autoTimer = setTimeout(dismiss, 15000);

  tip.classList.add("on");
  document.getElementById("installNo").onclick = dismiss;
  document.getElementById("installGo").onclick = () => {
    const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    toast(ios ? "点下方「分享 ⤴」→「添加到主屏幕」"
              : "点浏览器右上「⋮」→「添加到主屏幕 / 安装应用」", 5000);
  };
})();

/* Service Worker：让加桌面后是全屏 App，断网时也能打开外壳 */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

</script>
